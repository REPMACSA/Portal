<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Portal — REPMAC SA</title>
<style>
  :root{
    --azul:#1C6CB0; --azul-osc:#124A80; --celeste:#3AB4E8; --rojo:#E31E24;
    --gris:#F4F6F9; --texto:#1E293B; --muted:#64748B; --border:#E2E8F0;
  }
  *{box-sizing:border-box;}
  body{font-family:'Segoe UI',Arial,sans-serif;margin:0;background:var(--gris);color:var(--texto);}
  .proto-banner{background:#FEF3C7;color:#92400E;text-align:center;padding:6px;font-size:12.5px;font-weight:600;}

  /* ===== LOGIN ===== */
  #vistaLogin{min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;
    background:linear-gradient(160deg, var(--azul-osc) 0%, var(--azul) 55%, var(--celeste) 130%);}
  .login-box{background:#fff;border-radius:18px;padding:40px 36px;width:340px;box-shadow:0 20px 50px rgba(0,0,0,.25);text-align:center;}
  .login-box img{max-width:230px;margin-bottom:22px;}
  .login-box p{color:var(--muted);font-size:13px;margin:0 0 18px;}
  #pinInput{width:100%;text-align:center;font-size:1.8rem;letter-spacing:10px;padding:14px;border:2px solid var(--border);
    border-radius:10px;font-family:monospace;}
  #pinInput:focus{outline:none;border-color:var(--azul);}
  .btn-login{width:100%;margin-top:16px;background:var(--azul);color:#fff;border:none;padding:13px;border-radius:10px;
    font-weight:700;font-size:1rem;cursor:pointer;}
  .btn-login:hover{background:var(--azul-osc);}
  #loginError{color:var(--rojo);font-size:12.5px;margin-top:10px;min-height:16px;font-weight:600;}

  /* ===== HOME ===== */
  #vistaHome{display:none;}
  .topbar{background:var(--azul-osc);color:#fff;padding:12px 22px;display:flex;align-items:center;justify-content:space-between;}
  .topbar img{height:32px;}
  .topbar-right{display:flex;align-items:center;gap:14px;font-size:.85rem;}
  .btn-salir{background:transparent;border:1.5px solid rgba(255,255,255,.5);color:#fff;border-radius:20px;
    padding:5px 14px;font-size:.78rem;cursor:pointer;}
  .home-wrap{max-width:980px;margin:0 auto;padding:34px 20px 60px;}
  .saludo{font-size:1.5rem;font-weight:700;color:var(--azul-osc);margin-bottom:4px;}
  .saludo-sub{color:var(--muted);font-size:.92rem;margin-bottom:28px;}
  .grid-apps{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px;}
  .app-card{background:#fff;border-radius:16px;padding:22px 20px;border:1px solid var(--border);
    box-shadow:0 2px 10px rgba(0,0,0,.04);cursor:pointer;transition:transform .15s, box-shadow .15s;text-decoration:none;color:inherit;display:block;}
  .app-card:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(28,108,176,.18);}
  .app-card .icono{font-size:2.2rem;margin-bottom:10px;}
  .app-card .titulo{font-weight:700;font-size:1.02rem;color:var(--azul-osc);}
  .app-card .desc{font-size:.8rem;color:var(--muted);margin-top:4px;}
  .app-card.disabled{opacity:.5;cursor:not-allowed;}
  .app-card.disabled:hover{transform:none;box-shadow:0 2px 10px rgba(0,0,0,.04);}
  .badge-proximamente{display:inline-block;background:#FEF3C7;color:#92400E;font-size:.68rem;font-weight:700;
    padding:2px 8px;border-radius:10px;margin-top:6px;}

  /* ===== USUARIOS ===== */
  #vistaUsuarios{display:none;}
  .usuarios-wrap{max-width:980px;margin:0 auto;padding:30px 20px 60px;}
  .back-link{color:var(--azul);font-size:.85rem;cursor:pointer;font-weight:600;display:inline-block;margin-bottom:16px;}
  .card{background:#fff;border-radius:14px;padding:22px;border:1px solid var(--border);margin-bottom:18px;}
  table.usr{width:100%;border-collapse:collapse;font-size:.85rem;}
  table.usr th{background:var(--gris);text-align:left;padding:9px 10px;color:var(--azul-osc);border-bottom:2px solid var(--border);}
  table.usr td{padding:9px 10px;border-bottom:1px solid var(--border);}
  .pill-rol{padding:2px 9px;border-radius:10px;font-size:.7rem;font-weight:700;}
  .pill-superadmin{background:#FEE2E2;color:#991B1B;}
  .pill-administrativo{background:#DBEAFE;color:var(--azul-osc);}
  .pill-supervisor{background:#EDE9FE;color:#5B21B6;}
  .pill-jefe{background:#FEF3C7;color:#92400E;}
  .pill-tecnico{background:#DCFCE7;color:#166534;}
  .chk-app{margin-right:10px;}
  input[type=text],input[type=tel]{padding:8px 10px;border:1.5px solid var(--border);border-radius:8px;font-size:.85rem;width:100%;}
  label{font-size:.78rem;font-weight:600;color:var(--muted);display:block;margin-bottom:4px;margin-top:10px;}
  .btn{padding:9px 16px;border:none;border-radius:8px;font-weight:700;font-size:.82rem;cursor:pointer;}
  .btn-azul{background:var(--azul);color:#fff;}
  .btn-outline{background:#fff;border:1.5px solid var(--border);color:var(--texto);}
  .btn-rojo{background:var(--rojo);color:#fff;}
  .apps-grid-check{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-top:6px;}
  .apps-grid-check label{display:flex;align-items:center;gap:6px;font-weight:400;color:var(--texto);margin:0;}
</style>
</head>
<body>

<!-- ============ CONFIG (primera vez) ============ -->
<div id="vistaConfig" style="display:none;min-height:100vh;align-items:center;justify-content:center;flex-direction:column;
    background:linear-gradient(160deg, var(--azul-osc) 0%, var(--azul) 55%, var(--celeste) 130%);">
  <div class="login-box" style="width:380px;">
    <img id="logoConfig" src="" alt="Climatización Líder" style="max-width:230px;margin-bottom:22px;">
    <p style="text-align:left;">⚙️ Primera vez: pegá la URL de la API del Portal (Apps Script, termina en <code>/exec</code>)</p>
    <input type="text" id="scriptUrlInput" placeholder="https://script.google.com/macros/s/.../exec"
      style="width:100%;padding:12px;border:1.5px solid var(--border);border-radius:8px;font-size:.85rem;">
    <button class="btn-login" onclick="guardarScriptUrl()">Guardar y continuar</button>
  </div>
</div>

<!-- ============ LOGIN ============ -->
<div id="vistaLogin">
  <div class="login-box">
    <img id="logoLogin" src="" alt="Climatización Líder">
    <p>Ingresá tu PIN personal para acceder al sistema</p>
    <input type="password" id="pinInput" inputmode="numeric" maxlength="4" placeholder="••••"
      onkeydown="if(event.key==='Enter')intentarLogin()">
    <button class="btn-login" onclick="intentarLogin()">Ingresar</button>
    <div id="loginError"></div>
  </div>
</div>

<!-- ============ HOME ============ -->
<div id="vistaHome">
  <div class="topbar">
    <img id="logoTop" src="" alt="Líder">
    <div class="topbar-right">
      <span id="saludoTop"></span>
      <button class="btn-salir" onclick="salir()">🔒 Salir</button>
    </div>
  </div>
  <div class="home-wrap">
    <div class="saludo" id="saludoGrande"></div>
    <div class="saludo-sub">Elegí a dónde querés entrar</div>
    <div class="grid-apps" id="gridApps"></div>
  </div>
</div>

<!-- ============ USUARIOS (admin) ============ -->
<div id="vistaUsuarios">
  <div class="topbar">
    <img id="logoUsr" src="" alt="Líder">
    <div class="topbar-right">
      <span id="saludoUsr"></span>
      <button class="btn-salir" onclick="salir()">🔒 Salir</button>
    </div>
  </div>
  <div class="usuarios-wrap">
    <span class="back-link" onclick="mostrarHome()">← Volver al inicio</span>
    <div class="card">
      <h3 style="margin-top:0;color:var(--azul-osc);">➕ Agregar / editar persona</h3>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;">
        <div>
          <label>Nombre</label>
          <input type="text" id="uNombre" placeholder="Ej: Andrés Alegretti">
          <label>PIN (4 dígitos)</label>
          <input type="text" id="uPin" maxlength="4" placeholder="1234">
          <label>Rol</label>
          <select id="uRol" style="width:100%;padding:8px 10px;border:1.5px solid var(--border);border-radius:8px;">
            <option value="tecnico">Técnico</option>
            <option value="jefe">Jefe</option>
            <option value="supervisor">Supervisor</option>
            <option value="administrativo">Administrativo</option>
            <option value="superadmin">Superadmin (Franco/Tomás)</option>
          </select>
        </div>
        <div>
          <label>Apps habilitadas</label>
          <div class="apps-grid-check" id="checksApps"></div>
        </div>
      </div>
      <button class="btn btn-azul" style="margin-top:16px;" onclick="guardarUsuario()">💾 Guardar persona</button>
      <button class="btn btn-outline" style="margin-top:16px;" onclick="cancelarEdicion()">Cancelar edición</button>
    </div>

    <div class="card">
      <h3 style="margin-top:0;color:var(--azul-osc);">Personas con acceso</h3>
      <table class="usr" id="tablaUsuarios"></table>
    </div>
  </div>
</div>

// Llamada a la API vía JSONP (evita bloqueos de CORS al llamar desde GitHub Pages)
function api(action, data){
  return new Promise((resolve, reject) => {
    const cbName = 'cb_' + Date.now() + '_' + Math.floor(Math.random() * 1000000);
    window[cbName] = function(payload){
      delete window[cbName];
      script.remove();
      if(payload && payload.ok) resolve(payload);
      else reject(new Error((payload && payload.msg) || 'Error desconocido'));
    };
    const url = SCRIPT_URL + '?action=' + encodeURIComponent(action) + '&data=' + encodeURIComponent(JSON.stringify(data || {})) + '&callback=' + cbName;
    const script = document.createElement('script');
    script.src = url;
    script.onerror = function(){ delete window[cbName]; script.remove(); reject(new Error('No se pudo conectar')); };
    document.body.appendChild(script);
  });
}

// ===== INIT LOGOS =====
document.addEventListener("DOMContentLoaded", () => {
  const src = "data:image/png;base64," + LOGO_B64;
  document.getElementById("logoLogin").src = src;
  document.getElementById("logoTop").src = src;
  document.getElementById("logoUsr").src = src;
  document.getElementById("logoConfig").src = src;
  document.getElementById("logoTop").style.height = "34px";
  document.getElementById("logoUsr").style.height = "34px";

  if (!SCRIPT_URL) {
    document.getElementById("vistaLogin").style.display = "none";
    document.getElementById("vistaConfig").style.display = "flex";
    return;
  }

  // Si ya hay una sesión activa compartida (por ejemplo, volviste acá desde otra app), entrar directo.
  const sesion = leerSesionPortalCompartida();
  if (sesion) {
    usuarioActual = { nombre: sesion.nombre, rol: sesion.rol, pin: sesion.pin, apps: sesion.apps || [] };
    document.getElementById("vistaLogin").style.display = "none";
    mostrarHome();
    activarVigilanciaSesion_();
  }
});

// ══ SEGURIDAD DE SESIÓN: cierre automático a los 5 minutos de inactividad ══
const SESION_TIMEOUT_MS = 5 * 60 * 1000;
let sesionLockTimer = null;
function reiniciarTimerSesion_(){
  clearTimeout(sesionLockTimer);
  sesionLockTimer = setTimeout(salir, SESION_TIMEOUT_MS);
}
function activarVigilanciaSesion_(){
  reiniciarTimerSesion_();
  ['click','touchstart','keydown','scroll'].forEach(ev =>
    document.addEventListener(ev, reiniciarTimerSesion_, { passive: true })
  );
}
// Si el navegador restaura esta página desde su memoria (por ejemplo, al apretar "atrás"),
// forzamos una recarga real para que se vuelva a chequear la sesión desde cero.
window.addEventListener('pageshow', function(event){
  if (event.persisted) window.location.reload();
});

function guardarScriptUrl(){
  const url = document.getElementById("scriptUrlInput").value.trim();
  if(!url) return;
  localStorage.setItem('portal_scriptUrl', url);
  SCRIPT_URL = url;
  document.getElementById("vistaConfig").style.display = "none";
  document.getElementById("vistaLogin").style.display = "flex";
}

// Sesión compartida entre todas las apps del dominio (repmacsa.github.io) — vence sola a las 10 horas.
function leerSesionPortalCompartida(){
  try {
    const raw = localStorage.getItem('portal_sesion');
    if (!raw) return null;
    const s = JSON.parse(raw);
    const horas = (Date.now() - s.ts) / (1000 * 60 * 60);
    if (horas > 10) { localStorage.removeItem('portal_sesion'); return null; }
    return s;
  } catch(e) { return null; }
}

// ===== LOGIN =====
async function intentarLogin(){
  const pin = document.getElementById("pinInput").value.trim();
  const err = document.getElementById("loginError");
  err.textContent = "";
  if(!/^\d{4}$/.test(pin)){ err.textContent = "Ingresá un PIN de 4 dígitos"; return; }
  try{
    const res = await api('login', { pin });
    usuarioActual = { nombre: res.nombre, rol: res.rol, apps: res.apps, pin };
    // Sesión compartida entre todas las apps (mismo dominio repmacsa.github.io) — así no vuelven a pedir PIN.
    localStorage.setItem('portal_sesion', JSON.stringify({ nombre: res.nombre, pin, rol: res.rol, apps: res.apps, ts: Date.now() }));
    document.getElementById("vistaLogin").style.display = "none";
    mostrarHome();
    activarVigilanciaSesion_();
  }catch(e){
    err.textContent = e.message;
    document.getElementById("pinInput").value = "";
  }
}
function salir(){
  clearTimeout(sesionLockTimer);
  usuarioActual = null;
  localStorage.removeItem('portal_sesion'); // cierra sesión en todas las apps, no solo acá
  document.getElementById("vistaHome").style.display = "none";
  document.getElementById("vistaUsuarios").style.display = "none";
  document.getElementById("pinInput").value = "";
  document.getElementById("vistaLogin").style.display = "flex";
}

// Roles que ven la versión "Admin" de cada app (en vez de la de Técnico).
const ROLES_VISTA_ADMIN = ["superadmin", "administrativo"];
const ETIQUETAS_ROL = {
  superadmin: "Superadmin", administrativo: "Administrativo",
  supervisor: "Supervisor", jefe: "Jefe", tecnico: "Técnico"
};

// ===== HOME =====
function mostrarHome(){
  document.getElementById("vistaUsuarios").style.display = "none";
  document.getElementById("vistaHome").style.display = "block";
  document.getElementById("saludoTop").textContent = "👋 " + usuarioActual.nombre;
  document.getElementById("saludoGrande").textContent = "Hola, " + usuarioActual.nombre.split(" ")[0];

  const grid = document.getElementById("gridApps");
  let html = "";
  usuarioActual.apps.forEach(key => {
    const app = APPS[key];
    if(!app) return;
    const url = ROLES_VISTA_ADMIN.includes(usuarioActual.rol) ? app.urlAdmin : app.urlTecnico;
    html += `<a class="app-card" href="${url}">
      <div class="icono">${app.icono}</div>
      <div class="titulo">${app.nombre}</div>
      <div class="desc">${app.desc}</div>
    </a>`;
  });
  // Solo superadmin (Franco/Tomás) puede crear usuarios y cambiar PIN de otros.
  if(usuarioActual.rol === "superadmin"){
    html += `<div class="app-card" onclick="mostrarUsuarios()">
      <div class="icono">⚙️</div>
      <div class="titulo">Administrar Usuarios</div>
      <div class="desc">Altas, bajas y permisos por persona</div>
    </div>`;
  }
  grid.innerHTML = html;
}

// ===== USUARIOS (solo superadmin) =====
async function mostrarUsuarios(){
  if(usuarioActual.rol !== "superadmin"){ return; }
  document.getElementById("vistaHome").style.display = "none";
  document.getElementById("vistaUsuarios").style.display = "block";
  document.getElementById("saludoUsr").textContent = "👋 " + usuarioActual.nombre;
  poblarChecksApps();
  await cargarYRenderTabla();
}

function poblarChecksApps(){
  const cont = document.getElementById("checksApps");
  cont.innerHTML = Object.entries(APPS).filter(([k,a])=>!a.proximamente).map(([key, app]) => `
    <label><input type="checkbox" class="chk-app" value="${key}"> ${app.icono} ${app.nombre}</label>
  `).join("");
}

async function cargarYRenderTabla(){
  const tbl = document.getElementById("tablaUsuarios");
  tbl.innerHTML = "<tr><td>Cargando...</td></tr>";
  try{
    const res = await api('getUsuarios', { adminPin: usuarioActual.pin });
    listaUsuariosCache = res.usuarios;
    renderTablaUsuarios();
  }catch(e){
    tbl.innerHTML = "<tr><td style='color:var(--rojo);'>Error: " + e.message + "</td></tr>";
  }
}

function renderTablaUsuarios(){
  const tbl = document.getElementById("tablaUsuarios");
  let html = "<tr><th>Nombre</th><th>PIN</th><th>Rol</th><th>Apps</th><th></th></tr>";
  listaUsuariosCache.forEach(u => {
    const appsTxt = u.apps.map(k => APPS[k]?.icono || "").join(" ");
    html += `<tr>
      <td style="font-weight:600;">${u.nombre}</td>
      <td style="font-family:monospace;">${u.pin}</td>
      <td><span class="pill-rol pill-${u.rol}">${ETIQUETAS_ROL[u.rol] || u.rol}</span></td>
      <td>${appsTxt}</td>
      <td style="text-align:right;">
        <button class="btn btn-outline" style="padding:5px 10px;font-size:.72rem;" onclick="editarUsuario('${u.nombre}')">✏️</button>
        <button class="btn btn-rojo" style="padding:5px 10px;font-size:.72rem;" onclick="borrarUsuario('${u.nombre}')">🗑️</button>
      </td>
    </tr>`;
  });
  tbl.innerHTML = html;
}

function editarUsuario(nombre){
  const u = listaUsuariosCache.find(x => x.nombre === nombre);
  if(!u) return;
  editandoNombreOriginal = nombre;
  document.getElementById("uNombre").value = u.nombre;
  document.getElementById("uPin").value = u.pin;
  document.getElementById("uRol").value = u.rol;
  document.querySelectorAll(".chk-app").forEach(c => c.checked = u.apps.includes(c.value));
  window.scrollTo({top:0, behavior:"smooth"});
}
function cancelarEdicion(){
  editandoNombreOriginal = null;
  document.getElementById("uNombre").value = "";
  document.getElementById("uPin").value = "";
  document.getElementById("uRol").value = "tecnico";
  document.querySelectorAll(".chk-app").forEach(c => c.checked = false);
}

async function guardarUsuario(){
  const nombre = document.getElementById("uNombre").value.trim();
  const pin = document.getElementById("uPin").value.trim();
  const rol = document.getElementById("uRol").value;
  const apps = [...document.querySelectorAll(".chk-app:checked")].map(c => c.value);
  if(!nombre || !/^\d{4}$/.test(pin)){ alert("Completá nombre y un PIN de 4 dígitos"); return; }

  try{
    await api('guardarUsuario', {
      usuario: { nombre, pin, rol, apps },
      nombreOriginal: editandoNombreOriginal || '',
      adminPin: usuarioActual.pin
    });
    cancelarEdicion();
    await cargarYRenderTabla();
  }catch(e){
    alert("Error: " + e.message);
  }
}

async function borrarUsuario(nombre){
  if(!confirm("¿Sacar el acceso de " + nombre + "?")) return;
  try{
    await api('borrarUsuario', { nombre, adminPin: usuarioActual.pin });
    await cargarYRenderTabla();
  }catch(e){
    alert("Error: " + e.message);
  }
}
</script>
